<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10232B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kaddach">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light}body{margin:0}</style>
<title>Kaddach Fatoura</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  /* Concept: the utility meter is the interface. Porcelain dial plates, black counting drums
     you can spin, a staircase that shows the tranche you are standing on, and a bill that
     rolls like an odometer. Each utility lends its own signal color. */
  --bg:#E3E9E7; --plate:#F4F7F5; --plate2:#E9EFEC; --ink:#10232B; --muted:#4F636A; --line:#C2CECB;
  --drum:#0F1B21; --drum-ink:#F2F6F3; --dec:#B33A25;
  --panel:#0F1B21; --panel-ink:#EAF1EE; --panel-muted:#9FB2B8;
  --elec:#E0A100; --gaz:#E2562B; --eau:#1A86C9;
  --accent:var(--elec); --on-accent:#10232B; --focus:#1A86C9;
  --warn:#9A4A00; --ok:#1B6E46;
  --shadow:0 1px 0 rgba(255,255,255,.65) inset,0 12px 28px -16px rgba(16,35,43,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1317; --plate:#141F25; --plate2:#1B2A32; --ink:#E6EEEB; --muted:#9AAEB4; --line:#2A3B43;
    --drum:#040809; --elec:#F2B21A; --gaz:#FF7B4F; --eau:#52B6F2; --focus:#52B6F2;
    --warn:#F0A04B; --ok:#58C48C;
    --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 14px 30px -16px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1317; --plate:#141F25; --plate2:#1B2A32; --ink:#E6EEEB; --muted:#9AAEB4; --line:#2A3B43;
  --drum:#040809; --elec:#F2B21A; --gaz:#FF7B4F; --eau:#52B6F2; --focus:#52B6F2;
  --warn:#F0A04B; --ok:#58C48C;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 14px 30px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.5 'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:1080px;margin:0 auto;--dw:clamp(30px,9.4vw,46px);--dh:clamp(46px,13vw,64px)}
.app[lang="ar"]{font-family:'Cairo','Schibsted Grotesk',system-ui,sans-serif}
.app[data-util="elec"]{--accent:var(--elec)}
.app[data-util="gaz"]{--accent:var(--gaz)}
.app[data-util="eau"]{--accent:var(--eau)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.brand-name{font-family:'Big Shoulders Display','Cairo',sans-serif;font-weight:800;font-size:clamp(34px,7vw,52px);line-height:.95;letter-spacing:.02em;text-transform:uppercase}
.brand-tag{color:var(--muted);margin-top:6px;max-width:46ch;text-wrap:balance}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--plate)}
.lang button{font:inherit;font-weight:600;border:0;background:transparent;color:var(--muted);padding:7px 14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.demo{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;background:var(--plate2);border:1px dashed var(--line);border-radius:8px;padding:9px 12px;margin-bottom:14px;color:var(--muted)}
.demo button{font:inherit;font-weight:600;color:var(--ink);background:transparent;border:0;text-decoration:underline;cursor:pointer;padding:0}

/* utility selector */
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:18px}
.tab{font:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:9px;padding:13px 8px;border:1px solid var(--line);border-radius:10px;background:var(--plate);color:var(--ink);cursor:pointer;min-width:0}
.tab svg{width:20px;height:20px;flex:none;fill:currentColor}
.tab[aria-selected="true"]{border-color:transparent;color:var(--on-accent)}
.tab[data-u="elec"][aria-selected="true"]{background:var(--elec)}
.tab[data-u="gaz"][aria-selected="true"]{background:var(--gaz)}
.tab[data-u="eau"][aria-selected="true"]{background:var(--eau)}

.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
@media (max-width:880px){.grid{grid-template-columns:minmax(0,1fr)}}

.plate,.card{background:var(--plate);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px;min-width:0}
.plate-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.plate-title{font-family:'Big Shoulders Display','Cairo',sans-serif;font-weight:800;font-size:24px;letter-spacing:.03em;text-transform:uppercase;line-height:1.1}
.plate-hint{color:var(--muted);font-size:13px}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:var(--plate2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}

/* the counting drums */
.drums{display:flex;align-items:center;justify-content:center;gap:4px;padding:10px 12px;border-radius:10px;
  background:linear-gradient(#1c2b32,#0a1216);box-shadow:inset 0 2px 8px rgba(0,0,0,.65),0 0 0 3px var(--line);direction:ltr}
.dcol{display:flex;flex-direction:column;align-items:center;gap:3px}
.nudge{width:100%;height:22px;border:0;background:transparent;color:#8498A0;cursor:pointer;display:grid;place-items:center;border-radius:5px;padding:0}
.nudge:hover{color:#fff;background:rgba(255,255,255,.1)}
.nudge svg{width:14px;height:14px;fill:currentColor}
.comma{color:#fff;font-weight:800;font-size:26px;align-self:center;padding:0 1px}
.drum{position:relative;width:var(--dw);height:var(--dh);overflow:hidden;border-radius:5px;background:var(--drum);color:var(--drum-ink);
  touch-action:none;cursor:ns-resize;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);user-select:none;-webkit-user-select:none}
.drum::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(0,0,0,.78),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 70%,rgba(0,0,0,.78))}
.drum.dec{background:var(--dec);color:#fff}
.strip{transform:translateY(calc(var(--d,0)*var(--dh)*-1));transition:transform .36s cubic-bezier(.2,.8,.2,1)}
.strip.nt{transition:none}
.cell{height:var(--dh);display:grid;place-items:center;font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:calc(var(--dh)*.8);line-height:1;font-variant-numeric:tabular-nums}
.meter-unit{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin:10px 2px 0;font-size:13px;color:var(--muted)}
.meter-unit b{color:var(--ink);font-family:'Big Shoulders Display','Cairo',sans-serif;font-size:20px;letter-spacing:.04em}

.fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:12px}
@media (max-width:380px){.fields{grid-template-columns:minmax(0,1fr)}}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.fld input{font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:var(--plate2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%;font-variant-numeric:tabular-nums}
.quick{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.chip{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--plate2);color:var(--ink);border-radius:999px;padding:4px 11px;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.photo-row{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--plate);color:var(--ink);cursor:pointer}
.btn svg{width:18px;height:18px;fill:currentColor;flex:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.thumb{position:relative;width:54px;height:54px;border-radius:8px;overflow:hidden;border:1px solid var(--line);padding:0;background:var(--plate2);cursor:zoom-in}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-x{position:absolute;top:2px;inset-inline-end:2px;width:18px;height:18px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:12px;line-height:1;cursor:pointer;padding:0}
.thumb-box{position:relative;display:inline-block}

/* readout: the bill rolls like an odometer */
.readout{background:var(--panel);color:var(--panel-ink);border-radius:12px;padding:18px;box-shadow:var(--shadow);min-width:0}
.ro-top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.ro-label{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--panel-muted)}
.ro-pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--accent);color:var(--on-accent)}
.ro-amount{display:flex;align-items:flex-end;gap:12px;margin:12px 0 10px;direction:ltr;flex-wrap:wrap}
.odo{--dw:clamp(34px,11.2vw,62px);--dh:clamp(54px,17vw,92px);display:flex;gap:4px;padding:8px 10px;border-radius:10px;background:#000;box-shadow:inset 0 2px 8px rgba(0,0,0,.8),0 0 0 2px #2a3a42;direction:ltr}
.odo .drum{background:#050a0c;box-shadow:none}
.odo .drum.grp{margin-inline-end:8px}
.odo .drum.lead{color:#3b4a51}
.ro-cur{font-family:'Big Shoulders Display','Cairo',sans-serif;font-weight:800;font-size:clamp(26px,6vw,38px);line-height:1;color:var(--accent);padding-bottom:6px}
.ro-meta{color:var(--panel-ink);font-variant-numeric:tabular-nums}
.ro-sub{color:var(--panel-muted);font-size:13px;margin-top:2px}
.warn{margin-top:10px;padding:8px 10px;border-radius:8px;background:rgba(240,160,75,.14);color:#F7C58A;font-size:13px}
.ro-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.readout .btn{background:transparent;border-color:#33464e;color:var(--panel-ink)}
.readout .btn:hover{border-color:#8fa3aa}
.readout .btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.flash{font-size:13px;color:var(--panel-muted);align-self:center}

/* staircase */
.card h2{font-family:'Big Shoulders Display','Cairo',sans-serif;font-weight:800;font-size:22px;letter-spacing:.03em;text-transform:uppercase;line-height:1.1}
.card .sub{color:var(--muted);font-size:13px;margin-top:3px}
.stair{display:block;width:100%;height:auto;margin-top:10px;direction:ltr}
.stair text{font-family:'Schibsted Grotesk',system-ui,sans-serif}
.s-bg{fill:var(--plate2);stroke:var(--line)}
.s-fill{fill:var(--accent)}
.s-price{font-size:12px;font-weight:700;fill:var(--ink);text-anchor:middle}
.s-t{font-size:11px;font-weight:700;fill:var(--ink);text-anchor:middle}
.s-lim{font-size:11px;fill:var(--muted);text-anchor:middle}
.s-axis{stroke:var(--ink);stroke-width:1.5}
.s-mark{stroke:var(--ink);stroke-width:2}
.s-mtri{fill:var(--ink)}
.s-mlbl{font-size:12px;font-weight:700;fill:var(--ink)}
.tips{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.tips p{font-size:14px;padding-inline-start:12px;border-inline-start:3px solid var(--accent)}

/* ticket */
.ticket .row{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px dotted var(--line);align-items:baseline}
.ticket .row small{display:block;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.ticket .row b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.ticket .row.total{border-bottom:0;border-top:2px solid var(--ink);margin-top:6px;padding-top:10px;font-weight:800;font-size:17px}
.ticket .row.total b{font-weight:800}
.ticket .row.mute{color:var(--muted);font-size:13px;padding:5px 0}
.ticket .row.mute b{font-weight:500}
.ticket .base{color:var(--muted);font-size:13px;margin:6px 0 4px}
.ticket .rows{margin-top:6px}

/* lower sections */
.below{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
@media (max-width:880px){.below{grid-template-columns:minmax(0,1fr)}}
details.card>summary{cursor:pointer;list-style:none;font-family:'Big Shoulders Display','Cairo',sans-serif;font-weight:800;font-size:22px;letter-spacing:.03em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"+";font-size:26px;line-height:1;color:var(--muted)}
details.card[open]>summary::after{content:"\2212"}
details.card>.body{margin-top:12px;display:flex;flex-direction:column;gap:12px}
.hint{color:var(--muted);font-size:13px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dotted var(--line);flex-wrap:wrap}
.hist .h-main{min-width:0}
.hist .h-main b{font-variant-numeric:tabular-nums}
.hist .h-main small{display:block;color:var(--muted);font-size:12px}
.hist .h-act{display:flex;gap:6px;flex-wrap:wrap}
.mini{font:inherit;font-size:12px;font-weight:600;padding:5px 9px;border-radius:7px;border:1px solid var(--line);background:var(--plate2);color:var(--ink);cursor:pointer}
.mini:hover{border-color:var(--ink)}
.tr-grid{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
@media (max-width:420px){.tr-grid{grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) minmax(0,.8fr)}}
.tr-grid .hd{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tr-grid .tn{font-weight:700}
.tr-grid input,.pgrid input{font:inherit;font-size:15px;color:var(--ink);background:var(--plate2);border:1px solid var(--line);border-radius:7px;padding:7px 8px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.tr-grid input:disabled{color:var(--muted);background:transparent;border-style:dashed}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:420px){.pgrid{grid-template-columns:minmax(0,1fr)}}
.src{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.src a{color:var(--ink)}
.foot{margin-top:22px;color:var(--muted);font-size:13px;text-align:center}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.82);display:grid;place-items:center;padding:24px}
.lightbox img{max-width:min(92vw,720px);max-height:82vh;border-radius:10px}
@media (prefers-reduced-motion:reduce){.strip{transition:none}}

/* ---- v3 : page unifiée, trimestres, bilan, rappels ---- */
.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
.tab .tw{display:flex;gap:4px;align-items:center}
.plate-title svg{width:22px;height:22px;fill:var(--accent);vertical-align:-3px;margin-inline-end:4px}
.plate h3,.card h3.sech{font-family:'Big Shoulders Display','Cairo',sans-serif;font-weight:800;font-size:17px;letter-spacing:.04em;text-transform:uppercase;margin:0}
.card h3.sech{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.usec+.usec{margin-top:20px;padding-top:18px;border-top:2px dashed var(--line)}
.idxpair{display:grid;grid-template-columns:repeat(auto-fit,minmax(236px,1fr));gap:18px;--dw:28px;--dh:44px}
@media (max-width:540px){.idxpair{--dw:clamp(30px,10vw,40px);--dh:clamp(46px,14vw,58px)}}
.idxcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.idxcol .drums{padding:8px 8px;gap:3px}
.idxcol .plate-hint{min-height:2.6em}
.idrow{display:flex;gap:8px;align-items:flex-end;margin-top:4px}
.idrow .fld{flex:1}
.btn.ico{padding:9px 11px}
.dates-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
@media (max-width:380px){.dates-grid{grid-template-columns:minmax(0,1fr)}}
.fld select,.fld input[type=date]{font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:var(--plate2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%}
.alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:10px;background:var(--plate);border:1px solid var(--warn);border-inline-start-width:6px;color:var(--ink);font-weight:600}
.alert svg{width:20px;height:20px;fill:var(--warn);flex:none;margin-top:2px}
.ro-lines{display:flex;flex-direction:column;gap:6px;margin:4px 0 8px}
.ro-lines .ln{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:7px 0;border-bottom:1px dotted #33464e}
.ro-lines .ln small{display:block;color:var(--panel-muted);font-size:12px}
.ro-lines .ln b{font-variant-numeric:tabular-nums;white-space:nowrap}
.yrow{max-width:180px;margin:10px 0}
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
.qbtn{font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 8px;border:1px solid var(--line);border-radius:10px;background:var(--plate2);color:var(--ink);cursor:pointer;min-width:0;text-align:center}
.qbtn b{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.qbtn .qn{font-family:'Big Shoulders Display','Cairo',sans-serif;font-weight:800;font-size:23px;line-height:1.1;text-transform:uppercase}
.qbtn small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.qbtn:hover:not(:disabled){border-color:var(--ink)}
.qbtn.done{border-color:var(--ok);background:var(--plate)}
.qbtn.done small{color:var(--ok);font-weight:700}
.qbtn.sug{box-shadow:0 0 0 2px var(--accent)}
.qbtn:disabled{opacity:.5;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.stat{background:var(--plate2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat span{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.stat b{display:block;font-family:'Big Shoulders Display','Cairo',sans-serif;font-weight:800;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px}
.bars{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.bar{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.bar .tk{height:14px;border-radius:4px;background:var(--plate2);border:1px solid var(--line);overflow:hidden;direction:ltr}
.bar .tk i{display:block;height:100%;background:var(--accent)}
.bar b{font-variant-numeric:tabular-nums;white-space:nowrap}
.an-msg{margin-top:8px}
.rem{display:flex;flex-direction:column;gap:10px;padding:12px 0;border-bottom:1px dotted var(--line)}
.rem:last-of-type{border-bottom:0}
.rem p{font-size:14px}
.stair-wrap{display:flex;flex-direction:column;gap:20px}
details.card.ticket>summary{margin-bottom:0}
details.card.ticket[open]>summary{margin-bottom:10px}
</style>
</head>
<body>

<div id="app" class="app" data-util="elec" lang="fr" dir="ltr">
  <header class="top">
    <div>
      <h1 class="brand-name" id="tName"></h1>
      <p class="brand-tag" id="tTag"></p>
    </div>
    <div class="lang" role="group" aria-label="Langue / اللغة">
      <button type="button" data-lang="fr" aria-pressed="true">FR</button>

function stairSVG(U,Qc,unit){
  var W=336,x0=12,base=164,maxH=108,n=U.tr.length,w=W/n,L=limits(U),maxP=0,s='';
  U.tr.forEach(function(tr){maxP=Math.max(maxP,tr.price)});
  var mIdx=0,mFrac=0;
  U.tr.forEach(function(tr,i){
    var h=tr.price/maxP*maxH,x=x0+i*w,y=base-h,span=L.his[i]-L.los[i],fr=clamp((Qc-L.los[i])/span,0,1);
    if(Qc>=L.los[i]&&(Qc<L.his[i]||i===n-1)){mIdx=i;mFrac=fr}
    s+='<rect class="s-bg" x="'+(x+1)+'" y="'+y+'" width="'+(w-2)+'" height="'+h+'"/>';
    if(fr>0)s+='<rect class="s-fill" x="'+(x+1)+'" y="'+y+'" width="'+((w-2)*fr)+'" height="'+h+'"/>';
    s+='<text class="s-price" x="'+(x+w/2)+'" y="'+(y-6)+'">'+nf(tr.price,tr.price<1?4:2)+'</text>';
    s+='<text class="s-t" x="'+(x+w/2)+'" y="'+(base-9)+'">T'+(i+1)+'</text>';
    if(i<n-1)s+='<text class="s-lim" x="'+(x+w)+'" y="'+(base+17)+'">'+nf(tr.lim,0)+'</text>'});
  s+='<text class="s-lim" x="'+x0+'" y="'+(base+17)+'">0</text>';
  s+='<line class="s-axis" x1="'+x0+'" x2="'+(x0+W)+'" y1="'+base+'" y2="'+base+'"/>';
  var mx=x0+mIdx*w+mFrac*w,anchor=mx>W-80?'end':mx<80?'start':'middle',lx=anchor==='end'?mx+4:anchor==='start'?mx-4:mx;
  s+='<line class="s-mark" x1="'+mx+'" x2="'+mx+'" y1="30" y2="'+(base+3)+'"/><path class="s-mtri" d="M'+(mx-5)+' 22 L'+(mx+5)+' 22 L'+mx+' 31 Z"/>';
  s+='<text class="s-mlbl" x="'+lx+'" y="14" text-anchor="'+anchor+'">'+t('mark',nf(Qc,Qc<100&&unit!=='kWh'?1:0),unit)+'</text>';
  return '<svg class="stair" viewBox="0 0 360 188" role="img" aria-label="'+t('stTitle')+'">'+s+'</svg>'}

  $('#alerts').innerHTML=h}

function notifyDue(){
  if(!S.alert.notif||!('Notification' in window)||Notification.permission!=='granted')return;
  PAGES.forEach(function(pg){var a=alertInfo(pg);if(!a||a.state==='later')return;var key=pg+a.e+a.state;if(S.alert.sent[key])return;
    S.alert.sent[key]=1;save();var body=alertMsg(pg,a),title=t('alTitle');
    try{if(navigator.serviceWorker&&navigator.serviceWorker.ready){navigator.serviceWorker.ready.then(function(reg){reg.showNotification(title,{body:body,icon:'icon-192.png',badge:'icon-192.png',tag:'kaddach-'+pg})}).catch(function(){new Notification(title,{body:body})})}else new Notification(title,{body:body})}catch(e){}})}

function renderAlertCard(){
  var perm=NL?(S.alert.notif?'granted':'default'):(('Notification' in window)?Notification.permission:'na');
  var blocks=PAGES.map(function(pg){var a=alertInfo(pg),last=S.alert.last[pg]||'';
    return '<div class="rem"><label class="fld"><span>'+t('alLast',pgName(pg))+'</span><input type="date" data-last="'+pg+'" value="'+last+'"></label><p>'+(a?esc(t('alNext',fdate(a.ws),fdate(a.we))):t('alNone'))+'</p></div>'}).join('');
  var leads=[5,7,10,14].map(function(n){return '<option value="'+n+'"'+(n===S.alert.lead?' selected':'')+'>'+t('alDays',n)+'</option>'}).join('');
  var nb=perm==='na'?'<span class="hint">'+t('alNotifNA')+'</span>':perm==='denied'?'<span class="hint">'+t('alNotifNo')+'</span>':(S.alert.notif&&perm==='granted'?'<span class="hint">'+t('alNotifOn')+'</span>':'<button type="button" class="btn" id="btnNotif">'+BELL+'<span>'+t('alNotif')+'</span></button>');
  $('#alertCard').innerHTML='<h2>'+t('alTitle')+'</h2><p class="sub">'+t('alHelp')+'</p>'+blocks+
    '<label class="fld" style="max-width:220px;margin-top:6px"><span>'+t('alLead')+'</span><select id="alLead">'+leads+'</select></label>'+
    '<div class="ro-actions" style="margin-top:12px">'+nb+(NL?'':'<button type="button" class="btn primary" id="btnIcs">'+t('alIcs')+'</button>')+'</div><p class="hint" id="alMsg" role="status" style="margin-top:8px"></p><p class="hint" style="margin-top:6px">'+t('alNote')+'</p>';
  $$('[data-last]').forEach(function(inp){inp.addEventListener('change',function(){S.alert.last[inp.dataset.last]=inp.value||'';save();renderAlertBanner();renderAlertCard();notifyDue();nativeSchedule()})});
  $('#alLead').addEventListener('change',function(){S.alert.lead=Number(this.value);save();renderAlertBanner();renderAlertCard();notifyDue();nativeSchedule()})}

function buildICS(){
  var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Kaddach Fatoura//FR','CALSCALE:GREGORIAN'],n=0,z=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  PAGES.forEach(function(pg){var a=alertInfo(pg);if(!a)return;n++;
    var ev=a.e,st=addDays(a.ws,-S.alert.lead),en=addDays(a.we,1),nm=t('icsTitle',pgName(pg,true));
    L.push('BEGIN:VEVENT','UID:kaddach-'+pg+'-'+ev+'@kaddach-fatoura','DTSTAMP:'+z,'DTSTART;VALUE=DATE:'+st.replace(/-/g,''),'DTEND;VALUE=DATE:'+en.replace(/-/g,''),'RRULE:FREQ=MONTHLY;INTERVAL=3',
      'SUMMARY:'+nm,'DESCRIPTION:'+t('icsDesc'),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+nm,'TRIGGER:PT9H','END:VALARM','END:VEVENT')});
  L.push('END:VCALENDAR');return n?L.join('\r\n'):''}

function renderAll(){renderStatic();renderIdx();renderQ();renderCal();renderBar();renderSrc();renderAlertBanner();renderAlertCard();recompute()}

/* ---------- événements ---------- */
document.addEventListener('click',function(e){
  var tg=e.target.closest?e.target.closest('button,[data-lang]'):null;if(!tg)return;
  var pg=S.tab,D=S.dates[pg],us=PU[pg];
  if(tg.dataset.lang){S.lang=tg.dataset.lang;save();renderAll();return}
  if(tg.classList.contains('tab')){S.tab=tg.dataset.pg;save();renderAll();return}
  if(tg.id==='demoBtn'){UTILS.forEach(function(k){var x=S.u[k];x.start.idx=0;x.cur.idx=0});PAGES.forEach(function(p){S.dates[p].start=addDays(S.dates[p].cur,-61)});S.demo=false;save();renderAll();return}
  if(tg.dataset.q){var n=Number(tg.dataset.q),y=S.year,c=calcPage(pg);
    if(!c.ok||c.neg){flashQ(t('saveErr'));return}
    if(!S.q[pg][y])S.q[pg][y]={};var had=!!S.q[pg][y][n];S.q[pg][y][n]=makeRecord(pg);touch();save();
    var m=t(had?'updQ':'savedQ',t('q'+n),y);renderQ();recompute();flashQ(m);return}
  if(tg.id==='btnRepart'){us.forEach(function(u){var st=S.u[u];st.start={idx:st.cur.idx};st.photo.start=st.photo.cur;st.photo.cur=null});D.start=D.cur;touch();save();renderIdx();recompute();flashQ(t('repartDone'));return}
  if(tg.dataset.load){var r=(S.q[pg][S.year]||{})[tg.dataset.load];if(r){
    if(pg==='energie'){S.u.elec.start.idx=r.i.e0;S.u.elec.cur.idx=r.i.e1;S.u.gaz.start.idx=r.i.g0;S.u.gaz.cur.idx=r.i.g1}else{S.u.eau.start.idx=r.i.w0;S.u.eau.cur.idx=r.i.w1}
    D.start=r.d0;D.cur=r.d1;touch();save();renderIdx();recompute();window.scrollTo({top:0,behavior:'smooth'})}return}
  if(tg.dataset.delq){if(window.confirm(t('recDelAsk'))){var Y=S.q[pg][S.year];if(Y)delete Y[tg.dataset.delq];save();renderQ();recompute()}return}
  if(tg.id==='btnAnnual'){anOpen[pg+S.year]=true;renderQ();recompute();var o=$('#anOut');if(o&&o.scrollIntoView)o.scrollIntoView({behavior:'smooth',block:'nearest'});return}
  if(tg.id==='btnNotif'){if(NL){NL.requestPermissions().then(function(r){S.alert.notif=r.display==='granted';save();renderAlertCard();nativeSchedule()}).catch(function(){});return}if(!('Notification' in window))return;Notification.requestPermission().then(function(p){S.alert.notif=p==='granted';save();renderAlertCard();notifyDue()});return}
  if(tg.id==='btnIcs'){var txt=buildICS(),m2=$('#alMsg');
    if(!txt){m2.textContent=t('alIcsNone');return}
    try{var b=new Blob([txt],{type:'text/calendar'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kaddach-rappels.ics';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}catch(x){}return}
  if(tg.dataset.unphoto){var pr=tg.dataset.unphoto.split(':');S.u[pr[0]].photo[pr[1]]=null;renderThumb(pr[0],pr[1]);save();return}
  if(tg.dataset.zoom){var z=tg.dataset.zoom.split(':'),src=S.u[z[0]].photo[z[1]];if(src){var lb=document.createElement('div');lb.className='lightbox';lb.innerHTML='<img alt="" src="'+src+'">';lb.addEventListener('click',function(){lb.remove()});document.body.appendChild(lb)}return}
  if(tg.dataset.breset){S.u[tg.dataset.breset].p=null;renderBar();recompute();save();return}
  if(tg.id==='cal-go'){var a1=num($('#cal-c1').value),pd=num($('#cal-paid').value),msg=$('#cal-msg'),est,okc;
    if(pg==='energie'){var a2=num($('#cal-c2').value);okc=a1>0&&a2>=0&&pd>0&&isFinite(a2);
      if(okc)est=combine(bill('elec',P('elec'),a1),bill('gaz',P('gaz'),a2*P('gaz').coef)).total}
    else{okc=a1>0&&pd>0;if(okc)est=bill('eau',P('eau'),a1).total}
    if(!okc||!(est>0)){msg.textContent=t('calErr');return}
    var f=pd/est;S.cal[pg]={f:f,on:true};save();recompute();
    var pc=Math.abs(f-1)*100;msg.textContent=t('calRes',nf(pc,1),f>=1?t('calHigh'):t('calLow'));
    if(!$('#cal-clear')){var bb=document.createElement('button');bb.type='button';bb.className='btn';bb.id='cal-clear';bb.textContent=t('calClear');tg.parentNode.appendChild(bb)}return}
  if(tg.id==='cal-clear'){S.cal[pg]=null;save();renderCal();recompute();return}
});

/* ---------- démarrage ---------- */
odo=Odo($('#odo'),6);
renderAll();
notifyDue();
nativeSchedule();
})();
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
